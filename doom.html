<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>DOOM — Shadow Corridors</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#e8e8e8;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(0,0,0,.62) 100%);z-index:2}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(140,0,0,0) 28%,rgba(160,0,0,.95) 100%);transition:opacity .14s;z-index:3}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#190808 0%,#07070a 72%);z-index:20;text-align:center;padding:24px}
.hide{display:none!important}
.title{font-size:clamp(44px,15vw,104px);font-weight:900;letter-spacing:7px;color:#ff2b2b;text-shadow:0 0 12px #ff0000,0 0 42px #a00000,0 6px 0 #560000;line-height:1;font-family:'Arial Black','Courier New',sans-serif}
.sub{margin-top:10px;letter-spacing:6px;color:#ffb347;font-size:clamp(10px,3.4vw,16px);text-shadow:0 0 10px #ff6a00}
.desc{margin:22px auto 0;max-width:460px;font-size:13px;line-height:1.65;color:#b6b6c0}
.btn{margin-top:26px;padding:14px 34px;background:linear-gradient(180deg,#c21a1a,#7a0d0d);border:2px solid #ff5a5a;color:#fff;font-family:inherit;font-weight:bold;letter-spacing:3px;font-size:15px;cursor:pointer;box-shadow:0 0 18px rgba(255,40,40,.5),inset 0 0 14px rgba(255,120,120,.25);border-radius:4px}
.btn:active{transform:scale(.97)}
.small{margin-top:14px;font-size:11px;color:#71717c;letter-spacing:1px;line-height:1.7}
.stat{font-size:15px;color:#ffd76a;letter-spacing:2px;margin-top:10px;line-height:1.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hurt"></div>

<div id="menu" class="overlay">
  <div class="title">DOOM</div>
  <div class="sub">SHADOW CORRIDORS</div>
  <div class="desc">Станция «Фобос-7». Свет почти погас, в коридорах рычат твари.<br>В дальнем зале сидит <b style="color:#ff5a5a">Демон-надзиратель</b> — убей его и найди портал.</div>
  <button class="btn" id="startBtn">НАЧАТЬ ИГРУ</button>
  <div class="small">слева — движение · справа — обзор · красная кнопка — огонь<br>на ПК: WASD + мышь, пробел — стрельба, 1–4 — оружие</div>
  <div class="small" id="menuRec"></div>
</div>

<div id="pause" class="overlay hide">
  <div class="title" style="font-size:clamp(30px,9vw,56px)">ПАУЗА</div>
  <button class="btn" id="resumeBtn">ПРОДОЛЖИТЬ</button>
</div>

<div id="dead" class="overlay hide">
  <div class="title" style="font-size:clamp(32px,10vw,70px);color:#8a0d0d;text-shadow:0 0 18px #ff0000,0 0 50px #600">ВЫ ПОГИБЛИ</div>
  <div class="stat" id="deadStat"></div>
  <button class="btn" id="retryBtn">ЗАНОВО</button>
</div>

<div id="win" class="overlay hide">
  <div class="title" style="font-size:clamp(26px,8.5vw,60px);color:#37ff8a;text-shadow:0 0 20px #00ff88,0 0 50px #007a3c">УРОВЕНЬ ПРОЙДЕН</div>
  <div class="stat" id="winStat"></div>
  <button class="btn" id="againBtn">ЕЩЁ РАЗ</button>
</div>

<script>
(function(){
'use strict';

var cv = document.getElementById('c');
var ctx = cv.getContext('2d', {alpha:false});
var elMenu = document.getElementById('menu');
var elPause = document.getElementById('pause');
var elDead = document.getElementById('dead');
var elWin = document.getElementById('win');
var elHurt = document.getElementById('hurt');

var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function noise2(x,y){ var n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function dist2(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

/* ================= ЗВУК ================= */
var SFX = (function(){
  var ac=null, master=null;
  function init(){
    if(!ac){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.45;
      master.connect(ac.destination);
    }
    if(ac.state === 'suspended' && ac.resume) ac.resume();
  }
  function noiseBuf(dur){
    var n = Math.floor(ac.sampleRate*dur);
    var b = ac.createBuffer(1,n,ac.sampleRate);
    var d = b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    return b;
  }
  function burst(dur, gain, f1, f2){
    if(!ac) return;
    var src=ac.createBufferSource(); src.buffer=noiseBuf(dur);
    var g=ac.createGain(); g.gain.value=gain;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    var f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=f1;
    if(f2) f.frequency.exponentialRampToValueAtTime(f2, ac.currentTime+dur);
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }
  function tone(freq, dur, gain, type, end){
    if(!ac) return;
    var o=ac.createOscillator(); o.type=type||'sine'; o.frequency.value=freq;
    if(end) o.frequency.exponentialRampToValueAtTime(end, ac.currentTime+dur);
    var g=ac.createGain(); g.gain.value=gain;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur+0.02);
  }
  return {
    init:init,
    pistol:function(){ burst(0.12,0.32,2200,400); tone(130,0.1,0.14,'square',60); },
    shotgun:function(){ burst(0.32,0.6,1000,140); tone(72,0.26,0.24,'sawtooth',38); },
    auto:function(){ burst(0.07,0.22,2600,600); },
    rocket:function(){ burst(0.42,0.4,700,110); tone(95,0.34,0.18,'sawtooth',40); },
    boom:function(){ burst(0.75,0.75,500,70); tone(58,0.6,0.32,'sawtooth',24); },
    hurt:function(){ tone(190,0.2,0.18,'square',90); },
    growl:function(){ tone(88,0.36,0.13,'sawtooth',58); },
    hit:function(){ burst(0.06,0.18,1200,500); },
    pickup:function(){ tone(700,0.08,0.14,'square'); setTimeout(function(){tone(1040,0.1,0.13,'square');},70); },
    door:function(){ tone(180,0.3,0.1,'sawtooth',420); },
    empty:function(){ tone(140,0.06,0.1,'square',90); },
    die:function(){ burst(0.6,0.5,800,90); tone(70,0.7,0.2,'sawtooth',28); },
    win:function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){tone(f,0.22,0.16,'square');}, i*130); }); },
    boss:function(){ tone(60,0.8,0.25,'sawtooth',32); }
  };
})();

/* ================= ТЕКСТУРЫ ================= */
var TW = 64;
function mkTex(fn){
  var a = new Uint32Array(TW*TW);
  for(var y=0;y<TW;y++){
    for(var x=0;x<TW;x++){
      var c = fn(x,y);
      var r = clamp(c[0]|0,0,255), g = clamp(c[1]|0,0,255), b = clamp(c[2]|0,0,255);
      a[y*TW+x] = (4278190080 | (b<<16) | (g<<8) | r) >>> 0;
    }
  }
  return a;
}

var T = {};
var T_FLOOR, T_CEIL;
function buildTextures(){
  T[1] = mkTex(function(x,y){ /* сталь */
    var n = noise2(x*0.9, y*0.35);
    var v = 62 + n*22;
    var px = x%32, py = y%32;
    if(px<2 || py<2) v *= 0.5;
    if(px>29 || py>29) v *= 0.78;
    var rx = (px<16)?8:24, ry = (py<16)?8:24;
    var d = Math.sqrt((px-rx)*(px-rx)+(py-ry)*(py-ry));
    if(d<2.2) v *= 1.45; else if(d<3) v *= 0.72;
    var sheen = Math.max(0, 10-Math.abs(py-6))*1.5;
    return [v*0.80+sheen, v*0.88+sheen, v*1.03+sheen];
  });
  T[2] = mkTex(function(x,y){ /* камень */
    var n1 = noise2(x*0.35, y*0.35), n2 = noise2(x*1.6+10, y*1.6+10);
    var v = 52 + n1*20 + n2*12;
    v += Math.abs(Math.sin(x*0.28 + y*0.14))*9;
    if(Math.abs(noise2(x*0.12+5, y*0.12+5)-0.5) < 0.035) v *= 0.45;
    if(y%21 < 2) v *= 0.7;
    return [v, v*0.98, v*0.92];
  });
  T[3] = mkTex(function(x,y){ /* красная дверь */
    if(y<8 || y>56){
      return ((x+y)%16 < 8) ? [205,160,30] : [26,22,16];
    }
    var grad = 1 - Math.abs(x-32)/46;
    var v = 88 + grad*72;
    if(x%16 < 2) v *= 0.62;
    if(x>=30 && x<=34) v *= 0.55;
    var d = Math.sqrt(((x%16)-8)*((x%16)-8) + ((y%16)-8)*((y%16)-8));
    if(d<1.8) v *= 1.4;
    return [v*1.06, v*0.34, v*0.29];
  });
  T[4] = mkTex(function(x,y){ /* техно-панель */
    var v = 40 + noise2(x*0.8, y*0.8)*14;
    var px = x%21, py = y%16;
    if(px<1 || py<1) v *= 0.45;
    var lx = (x%21)-10, ly = (y%16)-8;
    var d = Math.sqrt(lx*lx+ly*ly);
    if(d < 2.1) return [90, 235, 150];
    if(d < 3.2) return [40, 140, 90];
    if(Math.abs(lx)<1.4 && Math.abs(ly)<5.5) return [255,120,40];
    return [v*0.70, v*0.95, v*1.12];
  });
  T[5] = mkTex(function(x,y){ /* кровавая стена */
    var v = 50 + noise2(x*0.4, y*0.4)*20;
    var bc = Math.sin(x*0.19)*0.5+0.5;
    var drip = Math.max(0, 1 - (y%40)/22);
    if(bc > 0.72 && drip > 0.15){
      var k = drip*bc;
      return [v*0.55+120*k, v*0.30, v*0.28];
    }
    return [v*0.95, v*0.62, v*0.58];
  });

  T_FLOOR = mkTex(function(x,y){
    var px = x%32, py = y%32;
    var v = 40 + noise2(x*0.9, y*0.9)*14;
    if(px<2 || py<2) v *= 0.45;
    if(px>29 || py>29) v *= 0.72;
    if(Math.abs((px+py)-32) < 1.5) v *= 0.76;
    return [v*0.85, v*0.90, v*0.95];
  });
  T_CEIL = mkTex(function(x,y){
    var v = 25 + noise2(x*0.6, y*0.6)*10;
    if(y%32 < 3) v *= 0.6;
    var px = (x%32)-16, py2 = (y%32)-16;
    if(Math.abs(px) < 1.5) v *= 0.5;
    var dd = Math.sqrt(px*px + py2*py2);
    if(dd < 2.4) return [190, 178, 120];
    return [v, v*0.95, v*0.90];
  });
}

/* ================= СПРАЙТЫ ================= */
function makeSprite(w,h,fn){
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  fn(g,w,h);
  var d = g.getImageData(0,0,w,h);
  return {w:w, h:h, canvas:c, data:new Uint32Array(d.data.buffer)};
}

function drawImp(g, frame){
  g.clearRect(0,0,64,64);
  var bob = (frame===1) ? 1.6 : 0;
  var grd = g.createRadialGradient(32,34,3,32,34,30);
  grd.addColorStop(0,'rgba(255,90,20,0.30)');
  grd.addColorStop(1,'rgba(255,60,0,0)');
  g.fillStyle = grd; g.fillRect(0,0,64,64);

  g.fillStyle = '#2a120a';
  g.beginPath(); g.ellipse(23,60+bob,8,4,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(41,60-bob,8,4,0,0,TAU); g.fill();

  g.fillStyle = '#4a1e12';
  g.beginPath(); g.ellipse(24,52+bob,6.5,9,-0.15,0,TAU); g.fill();
  g.beginPath(); g.ellipse(40,52-bob,6.5,9,0.15,0,TAU); g.fill();

  grd = g.createLinearGradient(18,26,46,50);
  grd.addColorStop(0,'#ad4a22'); grd.addColorStop(0.5,'#7d2f14'); grd.addColorStop(1,'#3f1608');
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(32,40,14,16,0,0,TAU); g.fill();
  g.strokeStyle = 'rgba(255,150,100,0.22)'; g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(32,30); g.lineTo(32,48); g.stroke();

  var armY = (frame===2)? 34 : 38;
  g.fillStyle = '#7a2c13';
  g.beginPath(); g.ellipse(15,armY,5.5,10,-0.4,0,TAU); g.fill();
  g.beginPath(); g.ellipse(49,armY,5.5,10,0.4,0,TAU); g.fill();

  g.fillStyle = '#f0d9c0';
  for(var i=0;i<3;i++){
    g.beginPath(); g.moveTo(11+i*2.2,armY+7); g.lineTo(9.5+i*2.2,armY+14); g.lineTo(13+i*2.2,armY+9); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(45+i*2.2,armY+7); g.lineTo(43.5+i*2.2,armY+14); g.lineTo(47+i*2.2,armY+9); g.closePath(); g.fill();
  }

  grd = g.createRadialGradient(28,19,2,32,22,14);
  grd.addColorStop(0,'#cd6f3c'); grd.addColorStop(1,'#6d2a12');
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(32,22,11,10,0,0,TAU); g.fill();

  g.fillStyle = '#2b1309';
  g.beginPath(); g.moveTo(24,14); g.lineTo(17,1); g.lineTo(27,11); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(40,14); g.lineTo(47,1); g.lineTo(37,11); g.closePath(); g.fill();

  g.shadowColor = '#ffcc00'; g.shadowBlur = 9;
  g.fillStyle = '#ffe14a';
  g.beginPath(); g.ellipse(27,20,2.4,2,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(37,20,2.4,2,0,0,TAU); g.fill();
  g.shadowBlur = 0;

  g.fillStyle = '#1a0805';
  g.beginPath(); g.ellipse(32,29,6,3.4,0,0,TAU); g.fill();
  g.fillStyle = '#e8d8c0';
  for(var j=0;j<4;j++){
    g.beginPath(); g.moveTo(27.2+j*3, 27.2); g.lineTo(28.4+j*3, 30.8); g.lineTo(29.6+j*3, 27.2); g.closePath(); g.fill();
  }

  if(frame===2){
    var fg = g.createRadialGradient(32,45,1,32,45,13);
    fg.addColorStop(0,'#ffffff'); fg.addColorStop(0.32,'#ffdd55');
    fg.addColorStop(0.62,'#ff7a10'); fg.addColorStop(1,'rgba(255,60,0,0)');
    g.fillStyle = fg;
    g.beginPath(); g.arc(32,45,13,0,TAU); g.fill();
  }
}

function drawImpDead(g){
  g.clearRect(0,0,64,64);
  var grd = g.createRadialGradient(32,52,2,32,52,24);
  grd.addColorStop(0,'rgba(150,0,0,0.9)');
  grd.addColorStop(1,'rgba(90,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(32,52,24,11,0,0,TAU); g.fill();
  g.fillStyle = '#5a2415';
  g.beginPath(); g.ellipse(32,50,16,8,0.1,0,TAU); g.fill();
  g.fillStyle = '#7d2f14';
  g.beginPath(); g.ellipse(38,52,8,6,0.2,0,TAU); g.fill();
  g.fillStyle = '#2b1309';
  g.beginPath(); g.ellipse(20,50,4.5,3,0,0,TAU); g.fill();
  g.fillStyle = '#b02020';
  g.beginPath(); g.ellipse(26,54,3,2,0,0,TAU); g.fill();
}

function drawZombie(g, frame){
  g.clearRect(0,0,64,64);
  var bob = (frame===1) ? 1.4 : 0;

  g.fillStyle = '#20261d';
  g.beginPath(); g.ellipse(25,58+bob,6,4,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(39,58-bob,6,4,0,0,TAU); g.fill();
  g.fillStyle = '#39412f';
  g.beginPath(); g.ellipse(25,51+bob,6,8,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(39,51-bob,6,8,0,0,TAU); g.fill();

  var grd = g.createLinearGradient(18,26,46,50);
  grd.addColorStop(0,'#61735a'); grd.addColorStop(0.55,'#3c4a35'); grd.addColorStop(1,'#212a1d');
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(32,39,13,15,0,0,TAU); g.fill();

  g.fillStyle = '#4c5a42';
  g.fillRect(21,30,22,12);
  g.fillStyle = '#2c3526';
  g.fillRect(21,36,22,3);

  g.fillStyle = '#4a5642';
  g.beginPath(); g.ellipse(14,37,5,9,-0.3,0,TAU); g.fill();
  g.beginPath(); g.ellipse(50,37,5,9,0.3,0,TAU); g.fill();

  g.fillStyle = '#171b17';
  g.fillRect(45,44,4,14);
  g.fillRect(47,42,10,3);

  g.fillStyle = '#8d9a80';
  g.beginPath(); g.ellipse(32,22,9.5,9.5,0,0,TAU); g.fill();

  g.fillStyle = '#3d5840';
  g.beginPath(); g.ellipse(32,15,11,7,0,0,TAU); g.fill();
  g.fillRect(21,14,22,4);

  g.fillStyle = '#2a1a1a';
  g.beginPath(); g.ellipse(32,29,5,2.6,0,0,TAU); g.fill();

  g.shadowColor = '#ff2200'; g.shadowBlur = 8;
  g.fillStyle = '#ff5533';
  g.beginPath(); g.ellipse(28,21,2,1.7,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(36,21,2,1.7,0,0,TAU); g.fill();
  g.shadowBlur = 0;

  g.fillStyle = 'rgba(150,20,20,0.55)';
  g.beginPath(); g.ellipse(26,34,4,5,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(37,43,3,4,0,0,TAU); g.fill();

  if(frame===2){
    var fg = g.createRadialGradient(55,44,1,55,44,10);
    fg.addColorStop(0,'#fff8c0'); fg.addColorStop(0.4,'#ffc93a');
    fg.addColorStop(1,'rgba(255,150,0,0)');
    g.fillStyle = fg;
    g.beginPath(); g.arc(55,44,10,0,TAU); g.fill();
  }
}

function drawZombieDead(g){
  g.clearRect(0,0,64,64);
  var grd = g.createRadialGradient(32,52,2,32,52,24);
  grd.addColorStop(0,'rgba(130,0,0,0.85)');
  grd.addColorStop(1,'rgba(80,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(32,52,24,10,0,0,TAU); g.fill();
  g.fillStyle = '#3c4a35';
  g.beginPath(); g.ellipse(32,50,17,7,0.08,0,TAU); g.fill();
  g.fillStyle = '#8d9a80';
  g.beginPath(); g.ellipse(45,49,6,5,0,0,TAU); g.fill();
  g.fillStyle = '#3d5840';
  g.beginPath(); g.ellipse(45,45,7,4,0,0,TAU); g.fill();
}

function drawBoss(g, frame){
  g.clearRect(0,0,128,128);
  var bob = (frame===1) ? 3 : 0;

  var aura = g.createRadialGradient(64,66,8,64,66,62);
  aura.addColorStop(0,'rgba(255,40,0,0.34)');
  aura.addColorStop(1,'rgba(255,0,0,0)');
  g.fillStyle = aura; g.fillRect(0,0,128,128);

  g.fillStyle = '#2a0808';
  g.beginPath(); g.ellipse(44,120+bob,17,8,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(84,120-bob,17,8,0,0,TAU); g.fill();

  g.fillStyle = '#5a100c';
  g.beginPath(); g.ellipse(46,104+bob,14,20,-0.1,0,TAU); g.fill();
  g.beginPath(); g.ellipse(82,104-bob,14,20,0.1,0,TAU); g.fill();

  var grd = g.createLinearGradient(34,52,94,104);
  grd.addColorStop(0,'#c22a16'); grd.addColorStop(0.5,'#7d130c'); grd.addColorStop(1,'#340604');
  g.fillStyle = grd;

/* ================= ПРОВЕРКИ МИРА ================= */
function tileAt(x,y){
  if(x<0 || y<0 || x>=MW || y>=MH) return 1;
  return map[(y|0)*MW + (x|0)];
}
function blocked(x,y,r){
  if(r===undefined) r = 0.24;
  return tileAt(x-r,y-r) || tileAt(x+r,y-r) || tileAt(x-r,y+r) || tileAt(x+r,y+r);
}
function los(x0,y0,x1,y1){
  var dx = x1-x0, dy = y1-y0;
  var d = Math.sqrt(dx*dx+dy*dy);
  if(d < 0.001) return true;
  var steps = Math.ceil(d/0.15);
  for(var i=1;i<steps;i++){
    var t = i/steps;
    if(tileAt(x0+dx*t, y0+dy*t)) return false;
  }
  return true;
}
function rayWallDist(x,y,dx,dy,maxd){
  var step = 0.06;
  for(var t=0;t<maxd;t+=step){
    if(tileAt(x+dx*t, y+dy*t)) return t;
  }
  return maxd;
}

  {name:'РАКЕТНИЦА', dmg:90, rate:1.0, ammo:'rockets', use:1, pellets:1, spread:0, snd:'rocket', kind:'rocket', range:30}
];

function tryShoot(){
  if(!P.alive) return;
  var W = WEAPONS[P.weapon];
  if(P.cool > 0) return;
  if(P[W.ammo] < W.use){ SFX.empty(); P.cool = 0.25; return; }

  P[W.ammo] -= W.use;
  P.cool = W.rate;
  P.kick = 1;
  P.muzzle = 0.07;
  P.shake = Math.max(P.shake, 0.35);
  stats.shots++;
  SFX[W.snd]();

  if(W.kind === 'hitscan'){
    for(var i=0;i<W.pellets;i++){
      var ang = P.a + (Math.random()-0.5)*W.spread*2;
      hitscan(ang, W.dmg, W.range);
    }
  } else {
    projectiles.push({
      kind:'rocket', x:P.x + Math.cos(P.a)*0.4, y:P.y + Math.sin(P.a)*0.4,
      vx:Math.cos(P.a)*9, vy:Math.sin(P.a)*9,
      dmg:W.dmg, life:4, owner:'player', scale:0.30, vOff:0.02
    });
  }
}

function hitscan(ang, dmg, range){
  var dx = Math.cos(ang), dy = Math.sin(ang);
  var wallD = rayWallDist(P.x, P.y, dx, dy, range);
  var best = null, bestD = wallD;

  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead) continue;
    var ex = e.x-P.x, ey = e.y-P.y;
    var t = ex*dx + ey*dy;
    if(t < 0.1 || t > bestD) continue;
    var perp = Math.abs(ex*dy - ey*dx);
    var rad = (e.type==='boss') ? 0.72 : 0.44;
    if(perp < rad){ best = e; bestD = t; }
  }

  if(best){
    hurtEnemy(best, dmg);
    stats.hits++;
  } else if(wallD < range){
    spark(P.x + dx*wallD, P.y + dy*wallD, 0.5, 6, 255, 200, 90);
  }
}

function hurtEnemy(e, dmg){
  if(e.dead) return;
  e.hp -= dmg;
  e.flash = 0.09;
  e.awake = true;
  spark(e.x, e.y, 0.45, 8, 190, 20, 20);
  if(e.hp <= 0){
    e.dead = true;
    e.deadT = 0;
    stats.kills++;
    SFX.die();
    if(e.type === 'boss'){ SFX.boss(); hint('ДЕМОН ПОВЕРЖЕН. НАЙДИ ПОРТАЛ!', 3.5); }
  } else {
    SFX.hit();
  }
}

function explode(x, y){
  SFX.boom();
  P.shake = Math.max(P.shake, 1.0);
  flashScreen(0.5);
  for(var i=0;i<26;i++){
    var a = Math.random()*TAU, s = 1.5 + Math.random()*4;
    particles.push({x:x, y:y, z:0.3+Math.random()*0.5, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      vz:1+Math.random()*2.5, life:0.5+Math.random()*0.5, size:0.05+Math.random()*0.06,
      r:255, g:120+Math.random()*100, b:20});
  }
  for(var j=0;j<enemies.length;j++){
    var e = enemies[j];
    if(e.dead) continue;
    var d = Math.sqrt(dist2(e.x,e.y,x,y));
    if(d < 2.6) hurtEnemy(e, 90*(1 - d/2.6) + 10);
  }
  var pd = Math.sqrt(dist2(P.x,P.y,x,y));
  if(pd < 2.4 && P.alive) damagePlayer((60*(1 - pd/2.4)) + 5);
}

var hurtTimer = 0;
function damagePlayer(d){
  if(!P.alive) return;
  d = Math.max(1, d);
  if(P.armor > 0){
    var absorb = Math.min(P.armor, d*0.5);
    P.armor -= absorb;
    d -= absorb;
  }
  P.hp -= d;
  P.shake = Math.max(P.shake, 0.7);
  SFX.hurt();
  elHurt.style.opacity = '0.85';
  clearTimeout(hurtTimer);
  hurtTimer = setTimeout(function(){ elHurt.style.opacity = '0'; }, 130);
  if(P.hp <= 0){
    P.hp = 0;
    P.alive = false;
    die();
  }
}

var flashAlpha = 0;
function flashScreen(a){ flashAlpha = Math.max(flashAlpha, a); }

function spark(x,y,z,count,r,g,b){
  for(var i=0;i<count;i++){
    var a = Math.random()*TAU, s = 0.8 + Math.random()*2.2;
    particles.push({x:x, y:y, z:z, vx:Math.cos(a)*s*0.5, vy:Math.sin(a)*s*0.5,
      vz:0.4+Math.random()*1.8, life:0.25+Math.random()*0.4,
      size:0.03+Math.random()*0.04, r:r, g:g, b:b});
  }
}

var hintText = '', hintTime = 0;
function hint(t, sec){ hintText = t; hintTime = sec; }

/* ================= ВВОД ================= */
var keys = {};
var moveStick = null, lookStick = null;
var firing = false, firingId = null;
var isDesktop = !('ontouchstart' in window);

function pointerPos(e){
  var r = cv.getBoundingClientRect();
  return {x:e.clientX - r.left, y:e.clientY - r.top};
}

function fireBtnPos(){ return {x:cssW - 74, y:cssH - 132, r:46}; }
function pauseBtnPos(){ return {x:cssW - 30, y:26, r:20}; }
function weaponBtnPos(i){ return {x:cssW - 30, y:70 + i*46, r:20}; }

cv.addEventListener('pointerdown', function(e){
  if(state !== 'playing') return;
  SFX.init();
  var p = pointerPos(e);
  var fb = fireBtnPos();

  if(Math.hypot(p.x-fb.x, p.y-fb.y) < fb.r + 8){
    firing = true; firingId = e.pointerId;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    return;
  }
  var pb = pauseBtnPos();
  if(Math.hypot(p.x-pb.x, p.y-pb.y) < pb.r + 6){ pauseGame(); return; }

  for(var i=0;i<4;i++){
    var wb = weaponBtnPos(i);
    if(Math.hypot(p.x-wb.x, p.y-wb.y) < wb.r + 4){ P.weapon = i; SFX.pickup(); return; }
  }

  if(e.pointerType === 'mouse') return;

  if(p.x < cssW*0.5) moveStick = {id:e.pointerId, ox:p.x, oy:p.y, x:p.x, y:p.y};
  else lookStick = {id:e.pointerId, ox:p.x, oy:p.y, x:p.x, y:p.y};

  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
}, {passive:true});

cv.addEventListener('pointermove', function(e){
  if(state !== 'playing') return;
  var p = pointerPos(e);
  if(moveStick && moveStick.id === e.pointerId){ moveStick.x = p.x; moveStick.y = p.y; }
  if(lookStick && lookStick.id === e.pointerId){ lookStick.x = p.x; lookStick.y = p.y; }
}, {passive:true});

function endPointer(e){
  if(moveStick && moveStick.id === e.pointerId) moveStick = null;
  if(lookStick && lookStick.id === e.pointerId) lookStick = null;
  if(firingId === e.pointerId){ firing = false; firingId = null; }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

document.addEventListener('keydown', function(e){
  keys[e.key.toLowerCase()] = true;
  if(state !== 'playing') return;
  if(e.key === ' '){ firing = true; e.preventDefault(); }
  if(e.key === 'Escape') pauseGame();
  if(e.key >= '1' && e.key <= '4') P.weapon = parseInt(e.key,10) - 1;
});
document.addEventListener('keyup', function(e){
  keys[e.key.toLowerCase()] = false;
  if(e.key === ' ') firing = false;
});

cv.addEventListener('mousedown', function(e){
  if(state !== 'playing' || e.button !== 0) return;
  if(document.pointerLockElement !== cv){
    if(cv.requestPointerLock) cv.requestPointerLock();
    return;
  }
  firing = true;
});
document.addEventListener('mouseup', function(e){
  if(e.button === 0 && document.pointerLockElement === cv) firing = false;
});
document.addEventListener('mousemove', function(e){
  if(document.pointerLockElement === cv && state === 'playing'){
    P.a += e.movementX * 0.0024;
    P.pitch = clamp(P.pitch - e.movementY * 0.0016, -0.32, 0.32);
  }
});

/* ================= ОБНОВЛЕНИЕ ================= */
function update(dt){
  stats.time += dt;

  var turnSpeed = 2.5;
  if(lookStick){
    var ldx = clamp((lookStick.x - lookStick.ox)/70, -1, 1);
    var ldy = clamp((lookStick.y - lookStick.oy)/70, -1, 1);
    P.a += ldx * turnSpeed * dt;
    P.pitch = clamp(P.pitch - ldy * 0.55 * dt, -0.32, 0.32);
  }
  if(keys['arrowleft']) P.a -= turnSpeed*dt;
  if(keys['arrowright']) P.a += turnSpeed*dt;
  if(keys['q']) P.a -= turnSpeed*dt;

  var fwd = 0, str = 0;
  if(keys['w'] || keys['ц'] || keys['arrowup']) fwd += 1;
  if(keys['s'] || keys['ы'] || keys['arrowdown']) fwd -= 1;
  if(keys['d'] || keys['в']) str += 1;
  if(keys['a'] || keys['ф']) str -= 1;

  if(moveStick){
    var mx = clamp((moveStick.x - moveStick.ox)/62, -1, 1);
    var my = clamp((moveStick.y - moveStick.oy)/62, -1, 1);
    fwd += -my;
    str += mx;
  }

  var mag = Math.sqrt(fwd*fwd + str*str);
  if(mag > 1){ fwd/=mag; str/=mag; }
  var moving = mag > 0.06;

  var speed = 3.4 * (keys['shift'] ? 1.45 : 1);
  var pdx = Math.cos(P.a), pdy = Math.sin(P.a);
  var rdx2 = -pdy, rdy2 = pdx;

  var vx = (pdx*fwd + rdx2*str) * speed * dt;
  var vy = (pdy*fwd + rdy2*str) * speed * dt;

  if(vx !== 0 && !blocked(P.x+vx, P.y)) P.x += vx;
  if(vy !== 0 && !blocked(P.x, P.y+vy)) P.y += vy;

  P.bob += dt * (moving ? 9 : 1.2);

  /* двери */
  for(var i=0;i<doors.length;i++){
    var d = doors[i];
    if(!d.open){
      var dd = Math.sqrt(dist2(d.x+0.5, d.y+0.5, P.x, P.y));
      if(dd < 1.55){
        d.open = true;
        map[d.y*MW+d.x] = 0;
        SFX.door();
      }
    }
  }

  /* оружие */
  P.cool = Math.max(0, P.cool - dt);
  P.muzzle = Math.max(0, P.muzzle - dt);
  P.shake = Math.max(0, P.shake - dt*2.6);
  P.kick = Math.max(0, P.kick - dt*6);
  if(firing) tryShoot();

  /* враги */
  for(var k=0;k<enemies.length;k++){
    var e = enemies[k];
    if(e.flash > 0) e.flash -= dt;

    if(e.dead){ e.deadT += dt; continue; }

    var ex = P.x - e.x, ey = P.y - e.y;
    var ed = Math.sqrt(ex*ex + ey*ey);

    if(!e.awake){
      if(ed < 15 && los(e.x,e.y,P.x,P.y)){ e.awake = true; SFX.growl(); }
      else continue;
    }

    var def = ETYPE[e.type];
    e.anim += dt * (e.type==='boss' ? 2.2 : 4.2);
    if(e.attacking > 0) e.attacking -= dt;
    if(e.cool > 0) e.cool -= dt;

    if(ed > def.range * 0.85){
      var nx = ex/ed, ny = ey/ed;
      var sp = def.speed * dt;
      var moved = false;

      if(!blocked(e.x + nx*sp, e.y + ny*sp, 0.32)){
        e.x += nx*sp; e.y += ny*sp; moved = true;
      } else {
        var aa = Math.atan2(ny, nx) + e.wobble*1.25;
        if(!blocked(e.x + Math.cos(aa)*sp, e.y + Math.sin(aa)*sp, 0.32)){
          e.x += Math.cos(aa)*sp; e.y += Math.sin(aa)*sp; moved = true;
        } else {
          e.wobble = -e.wobble;
        }
      }
      if(!moved){
        var aa2 = Math.atan2(ny, nx) + (Math.random()-0.5)*0.9;
        var sp2 = def.speed*0.7*dt;
        if(!blocked(e.x + Math.cos(aa2)*sp2, e.y + Math.sin(aa2)*sp2, 0.32)){
          e.x += Math.cos(aa2)*sp2; e.y += Math.sin(aa2)*sp2;
        }
      }
    } else {
      if(e.cool <= 0 && los(e.x, e.y, P.x, P.y)){
        e.cool = def.cool;
        e.attacking = 0.32;
        var ang0 = Math.atan2(ey, ex);

        if(e.type === 'boss'){
          for(var b=-1;b<=1;b++){
            var ab = ang0 + b*0.18;
            projectiles.push({kind:'fire', x:e.x + Math.cos(ab)*0.7, y:e.y + Math.sin(ab)*0.7,
              vx:Math.cos(ab)*6.5, vy:Math.sin(ab)*6.5, dmg:def.dmg, life:5,
              owner:'enemy', scale:0.42, vOff:0.02});
          }
          SFX.rocket();
        } else {
          var a1 = ang0 + (Math.random()-0.5)*0.08;
          projectiles.push({kind:'fire', x:e.x + Math.cos(a1)*0.55, y:e.y + Math.sin(a1)*0.55,
            vx:Math.cos(a1)*7, vy:Math.sin(a1)*7, dmg:def.dmg, life:4,
            owner:'enemy', scale:0.32, vOff:0.02});
          SFX.growl();
        }
      }
    }
  }

  /* снаряды */
  for(var p=projectiles.length-1; p>=0; p--){
    var pr = projectiles[p];
    pr.life -= dt;
    if(pr.life <= 0){ projectiles.splice(p,1); continue; }

    var nx2 = pr.x + pr.vx*dt;
    var ny2 = pr.y + pr.vy*dt;

    if(tileAt(nx2, ny2)){
      if(pr.owner === 'player') explode(pr.x, pr.y);
      else spark(pr.x, pr.y, 0.45, 6, 255, 120, 40);
      projectiles.splice(p,1);
      continue;
    }

    pr.x = nx2; pr.y = ny2;

    if(pr.owner === 'enemy'){
      if(dist2(pr.x, pr.y, P.x, P.y) < 0.20){
        damagePlayer(pr.dmg);
        spark(pr.x, pr.y, 0.45, 8, 255, 90, 40);
        projectiles.splice(p,1);
      }
    } else {
      var hitAny = false;
      for(var q=0;q<enemies.length;q++){
        var ee = enemies[q];
        if(ee.dead) continue;
        var rr = (ee.type==='boss') ? 0.75 : 0.45;
        if(dist2(pr.x, pr.y, ee.x, ee.y) < rr*rr){
          explode(pr.x, pr.y);
          hitAny = true;
          break;
        }
      }
      if(hitAny) projectiles.splice(p,1);
    }
  }

  /* предметы */
  for(var it=items.length-1; it>=0; it--){
    var obj = items[it];
    if(dist2(obj.x, obj.y, P.x, P.y) < 0.30){
      var def2 = ITEM[obj.type];
      var ok = false;
      if(def2.hp && P.hp < 100){ P.hp = Math.min(100, P.hp + def2.hp); ok = true; }
      if(def2.armor && P.armor < 100){ P.armor = Math.min(100, P.armor + def2.armor); ok = true; }
      if(def2.bullets){ P.bullets += def2.bullets; ok = true; }
      if(def2.rockets){ P.rockets += def2.rockets; ok = true; }
      if(ok){ SFX.pickup(); items.splice(it,1); }
    }
  }

  /* частицы */
  for(var pi=particles.length-1; pi>=0; pi--){
    var pa = particles[pi];
    pa.life -= dt;
    if(pa.life <= 0){ particles.splice(pi,1); continue; }
    pa.x += pa.vx*dt; pa.y += pa.vy*dt;
    pa.vz -= 6*dt;
    pa.z += pa.vz*dt;
    if(pa.z < 0.02){ pa.z = 0.02; pa.vz = 0; pa.vx *= 0.6; pa.vy *= 0.6; }
  }

  /* выход */
  var bossAlive = false;
  for(var bi=0; bi<enemies.length; bi++){
    if(enemies[bi].type === 'boss' && !enemies[bi].dead) bossAlive = true;
  }
  var exitD = Math.sqrt(dist2(EXIT.x+0.5, EXIT.y+0.5, P.x, P.y));
  if(exitD < 0.9){
    if(bossAlive) hint('ПОРТАЛ ЗАКРЫТ: СНАЧАЛА УБЕЙ ДЕМОНА', 1.2);
    else winGame();
  }

  if(hintTime > 0) hintTime -= dt;
  flashAlpha = Math.max(0, flashAlpha - dt*2.2);
}

/* ================= РЕНДЕР ================= */
var bufCv = document.createElement('canvas');
var bufCtx = null, imgData = null, buf32 = null, zBuffer = null;
var bufW = 320, bufH = 200;
var cssW = 1, cssH = 1, DPR = 1;
var dirX = 1, dirY = 0, planeX = 0, planeY = 0.66;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  cv.width = Math.floor(cssW * DPR);
  cv.height = Math.floor(cssH * DPR);
  cv.style.width = cssW + 'px';
  cv.style.height = cssH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;

  var aspect = cssW / cssH;
  var maxPix = 118000;
  var bh = 300;
  var bw = Math.round(bh * aspect);
  if(bw * bh > maxPix){
    var s = Math.sqrt(maxPix / (bw*bh));
    bw = Math.round(bw*s);
    bh = Math.round(bh*s);
  }
  if(bw < 150){ bw = 150; bh = Math.round(bw / aspect); }
  bw = Math.min(bw, 880);
  bw = Math.max(bw, 90);
  bh = Math.max(bh, 90);

  bufW = bw; bufH = bh;
  bufCv.width = bufW;
  bufCv.height = bufH;
  bufCtx = bufCv.getContext('2d');
  imgData = bufCtx.createImageData(bufW, bufH);
  buf32 = new Uint32Array(imgData.data.buffer);
  zBuffer = new Float32Array(bufW);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

function lightAt(d){ return clamp(1.32 - d*0.082, 0.16, 1); }

function render(){
  var shakeA = (Math.random()-0.5) * P.shake * 0.035;
  var dirAng = P.a + shakeA;
  dirX = Math.cos(dirAng); dirY = Math.sin(dirAng);
  planeX = -dirY * 0.66; planeY = dirX * 0.66;

  var horizon = Math.round(bufH*0.5 + P.pitch*bufH + (Math.random()-0.5)*P.shake*9);
  var pitchPx = horizon - bufH*0.5;

  buf32.fill(0xFF0A0C10);

  /* пол и потолок */
  var rd0x = dirX - planeX, rd0y = dirY - planeY;
  var rd1x = dirX + planeX, rd1y = dirY + planeY;
  var halfH = bufH * 0.5;

  for(var y = Math.max(0, horizon+1); y < bufH; y++){
    var p = y - horizon;
    if(p < 1) continue;
    var rowDist = halfH / p;
    if(rowDist > 46) continue;

    var stX = rowDist * (rd1x - rd0x) / bufW;
    var stY = rowDist * (rd1y - rd0y) / bufW;
    var fx = P.x + rowDist * rd0x;
    var fy = P.y + rowDist * rd0y;

    var shF = lightAt(rowDist) * 0.92;
    var shC = lightAt(rowDist) * 0.70;
    var yF = y * bufW;
    var yc = 2*horizon - y;
    var yC = (yc >= 0 && yc < bufH) ? yc * bufW : -1;

    for(var x = 0; x < bufW; x++){
      var cx = Math.floor(fx), cy = Math.floor(fy);
      var tx = (((fx - cx) * TW) | 0) & 63;
      var ty = (((fy - cy) * TW) | 0) & 63;
      var idx = ty*TW + tx;

      var cf = T_FLOOR[idx];
      var rf = (cf & 255) * shF;
      var gf = ((cf >> 8) & 255) * shF;
      var bf = ((cf >> 16) & 255) * shF;
      buf32[yF + x] = (4278190080 | (bf << 16) | (gf << 8) | rf) >>> 0;

      if(yC >= 0){
        var cc = T_CEIL[idx];
        var rc = (cc & 255) * shC;
        var gc = ((cc >> 8) & 255) * shC;
        var bc = ((cc >> 16) & 255) * shC;
        buf32[yC + x] = (4278190080 | (bc << 16) | (gc << 8) | rc) >>> 0;
      }

      fx += stX;
      fy += stY;
    }
  }

  /* стены */
  for(var sx = 0; sx < bufW; sx++){
    var cameraX = 2*sx/bufW - 1;
    var rdx = dirX + planeX*cameraX;
    var rdy = dirY + planeY*cameraX;

    var mapX = Math.floor(P.x), mapY = Math.floor(P.y);
    var deltaX = Math.abs(1/rdx), deltaY = Math.abs(1/rdy);
    var stepX2, stepY2, sdx, sdy;

    if(rdx < 0){ stepX2 = -1; sdx = (P.x - mapX) * deltaX; }
    else { stepX2 = 1; sdx = (mapX + 1 - P.x) * deltaX; }
    if(rdy < 0){ stepY2 = -1; sdy = (P.y - mapY) * deltaY; }
    else { stepY2 = 1; sdy = (mapY + 1 - P.y) * deltaY; }

    var side = 0, hitTile = 0, guard = 0;
    while(!hitTile && guard++ < 96){
      if(sdx < sdy){ sdx += deltaX; mapX += stepX2; side = 0; }
      else { sdy += deltaY; mapY += stepY2; side = 1; }

      if(mapX < 0 || mapY < 0 || mapX >= MW || mapY >= MH){ hitTile = 1; break; }
      var t2 = map[mapY*MW + mapX];
      if(t2 > 0){ hitTile = t2; }
    }
    if(!hitTile){ zBuffer[sx] = 99; continue; }

    var perp = (side === 0) ? (sdx - deltaX) : (sdy - deltaY);
    if(perp < 0.02) perp = 0.02;
    zBuffer[sx] = perp;

    var lineH = bufH / perp;
    var drawStart = -lineH/2 + horizon;
    var drawEnd = lineH/2 + horizon;

    var wallX;
    if(side === 0) wallX = P.y + perp*rdy;
    else wallX = P.x + perp*rdx;
    wallX -= Math.floor(wallX);

    var texX = (wallX * TW) | 0;
    if(side === 0 && rdx > 0) texX = TW - texX - 1;
    if(side === 1 && rdy < 0) texX = TW - texX - 1;
    if(texX < 0) texX = 0;
    if(texX > 63) texX = 63;

    var tex = T[hitTile] || T[1];
    var shade = lightAt(perp) * (side === 1 ? 0.76 : 1);
    var tStep = TW / lineH;

    var y0 = Math.max(0, Math.ceil(drawStart));
    var y1 = Math.min(bufH, Math.ceil(drawEnd));
    var tp = (y0 - drawStart) * tStep;

    for(var wy = y0; wy < y1; wy++){
      var tyy = tp | 0;
      tp += tStep;
      if(tyy < 0) tyy = 0;
      else if(tyy > 63) tyy = 63;
      var cc2 = tex[tyy*TW + texX];
      var rr = (cc2 & 255) * shade;
      var gg = ((cc2 >> 8) & 255) * shade;
      var bb = ((cc2 >> 16) & 255) * shade;
      buf32[wy*bufW + sx] = (4278190080 | (bb << 16) | (gg << 8) | rr) >>> 0;
    }
  }

  /* спрайты */
  var list = [];
  var i, e, d2;

  for(i=0;i<enemies.length;i++){
    e = enemies[i];
    var frame;
    if(e.dead) frame = -1;
    else if(e.attacking > 0) frame = 2;
    else if(Math.sin(e.anim) > 0) frame = 1;
    else frame = 0;

    var sp = (frame < 0) ? (SPR[e.type + 'Dead'] || e.spr[0]) : e.spr[frame];
    if(!sp) continue;
    d2 = dist2(e.x, e.y, P.x, P.y);
    list.push({
      sp:sp, x:e.x, y:e.y,
      scale:(frame<0 ? e.scale*0.55 : e.scale),
      vOff:(frame<0 ? 0.34 : e.vOff),
      dist:d2, tint:(e.flash>0 ? 0.8 : 0)
    });
  }
  for(i=0;i<items.length;i++){
    var it2 = items[i];
    d2 = dist2(it2.x, it2.y, P.x, P.y);
    list.push({sp:it2.spr, x:it2.x, y:it2.y, scale:it2.scale,
      vOff:it2.vOff + Math.sin(stats.time*2 + it2.bob)*0.015, dist:d2, tint:0});
  }
  for(i=0;i<projectiles.length;i++){
    var pj = projectiles[i];
    d2 = dist2(pj.x, pj.y, P.x, P.y);
    list.push({sp:(pj.kind==='rocket' ? SPR.rocket : SPR.fireball),
      x:pj.x, y:pj.y, scale:pj.scale, vOff:pj.vOff, dist:d2, tint:0});
  }
  d2 = dist2(EXIT.x+0.5, EXIT.y+0.5, P.x, P.y);
  list.push({sp:SPR.portal, x:EXIT.x+0.5, y:EXIT.y+0.5, scale:1.45, vOff:0.05, dist:d2, tint:0});

  list.sort(function(a,b){ return b.dist - a.dist; });
  for(i=0;i<list.length;i++) drawBillboard(list[i], pitchPx);

  bufCtx.putImageData(imgData, 0, 0);
  ctx.drawImage(bufCv, 0, 0, cssW, cssH);

  drawParticles();
  drawWeaponFrame();

  if(flashAlpha > 0.01){
    ctx.fillStyle = 'rgba(255,180,90,' + (flashAlpha*0.55).toFixed(3) + ')';
    ctx.fillRect(0,0,cssW,cssH);
  }

  drawHUD();
}

function drawBillboard(o, pitchPx){
  var spx = o.x - P.x, spy = o.y - P.y;
  var invDet = 1.0 / (planeX*dirY - dirX*planeY);
  if(!isFinite(invDet)) return;
  var trX = invDet * (dirY*spx - dirX*spy);
  var trY = invDet * (-planeY*spx + planeX*spy);
  if(trY <= 0.18) return;

  var screenX = Math.round((bufW/2) * (1 + trX/trY));
  var sprH = Math.abs((bufH/trY) * o.scale);
  if(sprH < 2) return;
  if(sprH > bufH*9) sprH = bufH*9;

  var sprW2 = Math.round(sprH * (o.sp.w / o.sp.h));
  if(sprW2 < 1) sprW2 = 1;
  var startX = screenX - (sprW2 >> 1);
  var vMove = (o.vOff * bufH) / trY;
  var startY = Math.round(-sprH/2 + bufH/2 + pitchPx + vMove);

  var shade = lightAt(trY);
  var data = o.sp.data;
  var sw = o.sp.w, shh = o.sp.h;
  var tint = o.tint;

  var x0 = Math.max(0, startX), x1 = Math.min(bufW, startX + sprW2);
  var y0 = Math.max(0, startY), y1 = Math.min(bufH, startY + sprH);

  for(var x = x0; x < x1; x++){
    if(trY >= zBuffer[x]) continue;
    var texX = (((x - startX) * sw / sprW2) | 0);
    if(texX < 0 || texX >= sw) continue;

    for(var y = y0; y < y1; y++){
      var texY = (((y - startY) * shh / sprH) | 0);
      if(texY < 0 || texY >= shh) continue;
      var c = data[texY*sw + texX];
      var al = (c >>> 24);
      if(al < 10) continue;

      var r = (c & 255), g = (c >> 8) & 255, b = (c >> 16) & 255;

      if(tint > 0){
        r = r + (255 - r)*tint;
        g = g + (255 - g)*tint;
        b = b + (255 - b)*tint;
      }
      r *= shade; g *= shade; b *= shade;

      var idx2 = y*bufW + x;
      if(al < 250){
        var dst = buf32[idx2];
        var a = al/255;
        var ia = 1 - a;
        r = r*a + (dst & 255)*ia;
        g = g*a + ((dst >> 8) & 255)*ia;
        b = b*a + ((dst >> 16) & 255)*ia;
      }
      buf32[idx2] = (4278190080 | ((b|0) << 16) | ((g|0) << 8) | (r|0)) >>> 0;
    }
  }
}

function drawParticles(){
  if(!particles.length) return;
  var invDet = 1.0 / (planeX*dirY - dirX*planeY);
  if(!isFinite(invDet)) return;

  for(var i=0;i<particles.length;i++){
    var p = particles[i];
    var spx = p.x - P.x, spy = p.y - P.y;
    var trX = invDet * (dirY*spx - dirX*spy);
    var trY = invDet * (-planeY*spx + planeX*spy);
    if(trY <= 0.2) continue;

    var sx = (bufW/2) * (1 + trX/trY);
    var bx = Math.round(sx * cssW / bufW);
    if(bx < 0 || bx >= cssW) continue;

    var zc = Math.floor(clamp(sx, 0, bufW-1));
    if(trY > zBuffer[zc]) continue;

    var sy = (bufH/2 + P.pitch*bufH) + ((0.5 - p.z) * bufH) / trY;
    var by = sy * cssH / bufH;

    var size = Math.max(1.5, (p.size * bufH / trY) * (cssW / bufW));
    var alpha = clamp(p.life*1.6, 0, 1);

    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgb(' + (p.r|0) + ',' + (p.g|0) + ',' + (p.b|0) + ')';
    ctx.fillRect(bx - size/2, by - size/2, size, size);
    ctx.globalAlpha = 1;
  }
}

function drawWeaponFrame(){
  var ws = WEAPON_SPR[P.weapon];
  if(!ws) return;
  var spr = ws.spr;

  var scale = Math.min(cssW / 360, cssH / 420) * 1.15;
  scale = Math.max(scale, 0.55);

  var dw = spr.w * scale;
  var dh = spr.h * scale;

  var bobX = Math.sin(P.bob) * 9 * scale;
  var bobY = Math.abs(Math.cos(P.bob)) * 7 * scale;
  var kickY = P.kick * 26 * scale;

  var x = cssW/2 - dw/2 + bobX;
  var y = cssH - dh + bobY + kickY + 20;

  ctx.drawImage(spr.canvas, x, y, dw, dh);

  if(P.muzzle > 0){
    var mx = x + dw * ws.mx;
    var my = y + dh * ws.my;
    var rad = Math.min(cssW, cssH) * 0.12;
    var grd = ctx.createRadialGradient(mx, my, 1, mx, my, rad);
    grd.addColorStop(0, 'rgba(255,255,240,0.95)');
    grd.addColorStop(0.35, 'rgba(255,215,90,0.75)');
    grd.addColorStop(0.7, 'rgba(255,120,20,0.30)');
    grd.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(mx, my, rad, 0, TAU);
    ctx.fill();
  }
}

/* ================= HUD ================= */
function drawHUD(){
  var ms = 4;
  var mwPx = MW*ms, mhPx = MH*ms;
  var ox = 12, oy = 12;

  ctx.save();
  ctx.globalAlpha = 0.86;
  ctx.fillStyle = 'rgba(6,8,12,0.82)';
  ctx.fillRect(ox-4, oy-4, mwPx+8, mhPx+8);
  ctx.strokeStyle = 'rgba(255,70,60,0.45)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(ox-4, oy-4, mwPx+8, mhPx+8);

  for(var y=0;y<MH;y++){
    for(var x=0;x<MW;x++){
      var t = map[y*MW+x];
      if(t === 0) continue;
      if(t === 3) ctx.fillStyle = '#e0a020';
      else if(t === 2) ctx.fillStyle = '#5a5a60';
      else if(t === 4) ctx.fillStyle = '#2a6a55';
      else if(t === 5) ctx.fillStyle = '#7a2020';
      else ctx.fillStyle = '#3a4048';
      ctx.fillRect(ox + x*ms, oy + y*ms, ms, ms);
    }
  }

  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(e.dead || !e.awake) continue;
    ctx.fillStyle = (e.type==='boss') ? '#ff3b3b' : '#d06030';
    ctx.fillRect(ox + e.x*ms - 1.5, oy + e.y*ms - 1.5, 3, 3);
  }

  ctx.fillStyle = '#43ff9e';
  ctx.fillRect(ox + (EXIT.x+0.5)*ms - 2, oy + (EXIT.y+0.5)*ms - 2, 4, 4);

  var pxm = ox + P.x*ms, pym = oy + P.y*ms;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(pxm + Math.cos(P.a)*6, pym + Math.sin(P.a)*6);
  ctx.lineTo(pxm + Math.cos(P.a+2.5)*4.5, pym + Math.sin(P.a+2.5)*4.5);
  ctx.lineTo(pxm + Math.cos(P.a-2.5)*4.5, pym + Math.sin(P.a-2.5)*4.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  var pb = pauseBtnPos();
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = 'rgba(10,12,16,0.75)';
  ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#e8e8ec';
  ctx.fillRect(pb.x-6, pb.y-7, 4, 14);
  ctx.fillRect(pb.x+2, pb.y-7, 4, 14);
  ctx.restore();

  for(var w=0;w<4;w++){
    var wb = weaponBtnPos(w);
    var active = (P.weapon === w);
    ctx.save();
    ctx.globalAlpha = active ? 0.95 : 0.62;
    ctx.fillStyle = active ? 'rgba(190,30,30,0.85)' : 'rgba(10,12,16,0.75)';
    ctx.beginPath(); ctx.arc(wb.x, wb.y, wb.r-3, 0, TAU); ctx.fill();
    ctx.strokeStyle = active ? '#ff8a6a' : 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(wb.x, wb.y, wb.r-3, 0, TAU); ctx.stroke();
    ctx.fillStyle = active ? '#fff' : '#c8c8d0';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(w+1), wb.x, wb.y+1);
    ctx.restore();
  }

  var fb = fireBtnPos();
  ctx.save();
  var fg = ctx.createRadialGradient(fb.x-10, fb.y-12, 4, fb.x, fb.y, fb.r);
  fg.addColorStop(0, firing ? '#ff8a5a' : '#e33a2a');
  fg.addColorStop(1, firing ? '#8c1208' : '#5e0a06');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,180,150,0.75)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ОГОНЬ', fb.x, fb.y);
  ctx.restore();

  if(moveStick) drawStick(moveStick, 'rgba(120,200,255,0.5)');
  if(lookStick) drawStick(lookStick, 'rgba(255,180,80,0.5)');

  var panelH = 46;
  var py0 = cssH - panelH;
  var grd2 = ctx.createLinearGradient(0, py0, 0, cssH);
  grd2.addColorStop(0, 'rgba(8,9,12,0)');
  grd2.addColorStop(0.35, 'rgba(8,9,12,0.7)');
  grd2.addColorStop(1, 'rgba(8,9,12,0.92)');
  ctx.fillStyle = grd2;
  ctx.fillRect(0, py0, cssW, panelH);

  ctx.textBaseline = 'middle';

  var hpCol = P.hp > 60 ? '#5dff8a' : (P.hp > 30 ? '#ffd23a' : '#ff4a3a');
  ctx.textAlign = 'left';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillStyle = 'rgba(200,200,210,0.65)';
  ctx.fillText('HP', 16, py0 + 16);
  ctx.font = 'bold 24px "Courier New", monospace';
  ctx.fillStyle = hpCol;
  ctx.fillText(String(Math.ceil(P.hp)), 16, py0 + 33);

  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillStyle = 'rgba(200,200,210,0.65)';
  ctx.fillText('ARM', 86, py0 + 16);
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillStyle = '#63c8ff';
  ctx.fillText(String(Math.ceil(P.armor)), 86, py0 + 33);

  var ammoVal, ammoLabel, ammoCol;
  if(P.weapon === 3){ ammoVal = P.rockets; ammoLabel = 'РАКЕТЫ'; ammoCol = '#ff9a3c'; }
  else { ammoVal = P.bullets; ammoLabel = 'ПАТРОНЫ'; ammoCol = '#ffd23a'; }

  ctx.textAlign = 'right';
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillStyle = 'rgba(200,200,210,0.6)';
  ctx.fillText(ammoLabel, cssW - 130, py0 + 16);
  ctx.font = 'bold 24px "Courier New", monospace';
  ctx.fillStyle = ammoVal > 0 ? ammoCol : '#ff4a3a';
  ctx.fillText(String(ammoVal), cssW - 130, py0 + 33);

  ctx.textAlign = 'center';
  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.fillStyle = 'rgba(255,150,120,0.9)';
  ctx.fillText(WEAPONS[P.weapon].name, cssW/2, py0 + 16);
  ctx.fillStyle = 'rgba(180,180,190,0.6)';
  ctx.fillText('УБИТО ' + stats.kills + '/' + stats.total, cssW/2, py0 + 33);

  if(hintTime > 0){
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px "Courier New", monospace';
    var a2 = clamp(hintTime, 0, 1);
    ctx.fillStyle = 'rgba(255,220,150,' + a2.toFixed(2) + ')';
    ctx.fillText(hintText, cssW/2, cssH*0.24);
  }
}

function drawStick(st, color){
  var maxR = 62;
  var dx = st.x - st.ox, dy = st.y - st.oy;
  var m = Math.sqrt(dx*dx + dy*dy);
  if(m > maxR){ dx = dx/m*maxR; dy = dy/m*maxR; }

  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(st.ox, st.oy, maxR, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath(); ctx.arc(st.ox, st.oy, maxR, 0, TAU); ctx.fill();

  ctx.globalAlpha = 0.85;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(st.ox + dx, st.oy + dy, 18, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ================= СОСТОЯНИЯ ================= */
var state = 'menu';
var lastT = 0;

function blurActive(){
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(err){}
}

function startGame(){
  SFX.init();
  initLevel();
  state = 'playing';
  elMenu.classList.add('hide');
  elPause.classList.add('hide');
  elDead.classList.add('hide');
  elWin.classList.add('hide');
  elHurt.style.opacity = '0';
  firing = false;
  moveStick = null;
  lookStick = null;
  blurActive();
  hint('УБЕЙ ДЕМОНА И НАЙДИ ПОРТАЛ', 3);
  lastT = performance.now();
}

function pauseGame(){
  if(state !== 'playing') return;
  state = 'paused';
  elPause.classList.remove('hide');
  firing = false;
  moveStick = null;
  lookStick = null;
  blurActive();
}

function resumeGame(){
  if(state !== 'paused') return;
  state = 'playing';
  elPause.classList.add('hide');
  blurActive();
  lastT = performance.now();
}

function die(){
  state = 'dead';
  document.getElementById('deadStat').innerHTML =
    'Убито демонов: <b>' + stats.kills + ' из ' + stats.total + '</b><br>' +
    'Время: <b>' + stats.time.toFixed(1) + ' сек</b>';
  elDead.classList.remove('hide');
  if(document.pointerLockElement) document.exitPointerLock();
}

function winGame(){
  state = 'win';
  SFX.win();
  var acc = stats.shots > 0 ? Math.min(100, Math.round(stats.hits/stats.shots*100)) : 0;
  var html =
    'Убито демонов: <b>' + stats.kills + ' из ' + stats.total + '</b><br>' +
    'Точность: <b>' + acc + '%</b><br>' +
    'Время: <b>' + stats.time.toFixed(1) + ' сек</b>';

  try{
    var best = parseFloat(localStorage.getItem('doom_best'));
    if(!best || stats.time < best){
      localStorage.setItem('doom_best', String(stats.time));
      html += '<br><span style="color:#37ff8a">НОВЫЙ РЕКОРД!</span>';
    }
  }catch(err){}

  document.getElementById('winStat').innerHTML = html;
  elWin.classList.remove('hide');
  if(document.pointerLockElement) document.exitPointerLock();
}

document.getElementById('startBtn').addEventListener('click', function(e){ e.preventDefault(); startGame(); });
document.getElementById('resumeBtn').addEventListener('click', function(e){ e.preventDefault(); resumeGame(); });
document.getElementById('retryBtn').addEventListener('click', function(e){ e.preventDefault(); startGame(); });
document.getElementById('againBtn').addEventListener('click', function(e){ e.preventDefault(); startGame(); });

document.addEventListener('visibilitychange', function(){
  if(document.hidden && state === 'playing') pauseGame();
});

try{
  var bestT = parseFloat(localStorage.getItem('doom_best'));
  if(bestT) document.getElementById('menuRec').innerHTML = 'рекорд прохождения: ' + bestT.toFixed(1) + ' сек';
}catch(err){}

/* ================= ЦИКЛ ================= */
function loop(t){
  requestAnimationFrame(loop);
  var dt = (t - lastT) / 1000;
  lastT = t;
  if(!isFinite(dt) || dt <= 0) dt = 0.016;
  if(dt > 0.06) dt = 0.06;

  if(state === 'playing'){
    update(dt);
    render();
  }
}

/* ================= СТАРТ ================= */
buildTextures();
buildSprites();
resize();
initLevel();
state = 'menu';
render();
requestAnimationFrame(function(t){ lastT = t; loop(t); });

})();
</script>
